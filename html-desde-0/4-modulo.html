<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!--
        TABLAS
        las filas son tr (table row)
        las celdas son las divisiones de cada fila td (table data)
    -->
    <table>
      <tr>
        <td></td>
        <td>Lunes</td>
        <td>Martes</td>
        <td>Miercoles</td>
      </tr>
      <tr>
        <td>Ingresos</td>
        <td>100</td>
        <td>200</td>
        <td>100</td>
      </tr>
      <tr>
        <td>egresos</td>
        <td>75</td>
        <td>220</td>
        <td>100</td>
      </tr>
      <tr>
        <td>saldo</td>
        <td>25</td>
        <td>-20</td>
        <td>0</td>
      </tr>
      <tr>
        <td>final</td>
        <td></td>
        <td></td>
        <td>5</td>
      </tr>
    </table>

    <table>
      <caption></caption>
      <thead>
        <tr>
          <th></th>
          <th></th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td></td>
          <td></td>
          <td></td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td></td>
          <td></td>
        </tr>
      </tfoot>
    </table>

    <!-- 
    para agrupar colunmas es colspan=n
    para agrupar filas rowspan=n 
    n es numero que se quiere agrupar

    colgroup es para ajuntar toda una columna 

    -->
    <table>
      <colgroup>
        <col />
        <col />
        <col />
        <col />
      </colgroup>
      <tr>
        <td></td>
        <td>Lunes</td>
        <td>Martes</td>
        <td>Miercoles</td>
      </tr>
      <tr>
        <td>Ingresos</td>
        <td>100</td>
        <td>200</td>
        <td>100</td>
      </tr>
      <tr>
        <td>egresos</td>
        <td>75</td>
        <td>220</td>
        <td>100</td>
      </tr>
      <tr>
        <td>saldo</td>
        <td>25</td>
        <td>-20</td>
        <td>0</td>
      </tr>
      <tr>
        <td>final</td>
        <td></td>
        <td></td>
        <td>5</td>
      </tr>
    </table>
  </body>
</html>
