# Conf para evitar 404 en rutas: redirige TODO a index.php excepto archivos/folders reales
<Directory /var/www/html>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted

    # Si no es un archivo existente, ni carpeta, ni recurso estático → pasa a index.php
    RewriteEngine On

    # Ignorar redirección para archivos reales (CSS, JS, imágenes)
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d

    # Redirigir cualquier otra ruta a index.php
    RewriteRule ^(.*)$ index.php [QSA,L]
</Directory>
