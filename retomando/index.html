<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio Basicos</title>
  </head>
  <body>
    <h1>Bienvenidos</h1>
    <h2>Praticando y recordando</h2>

    <h2>Primera parte</h2>

    <p>Digite dos numeros</p>
    <input type="number" placeholder="Numero 1" id="number-1" />
    <input type="number" placeholder="Numero 2" id="number-2" />
    <button onclick="plus()">Sumar</button>
    <button onclick="subtraction()">Restar</button>
    <button onclick="split()">Dividir</button>
    <button onclick="multiplication()">Multiplicar</button>
    <button onclick="hider()">Numero mayor</button>
    <button onclick="cousin()">Numero 1 es primo?</button>
    <button onclick="fac()">Numero 1 factorial</button>
    <button onclick="par()">Numero 1 es par?</button>
    <p id="result"></p>

    <h2>Segunda parte</h2>
    <p>Digite una cadena de texto</p>
    <input type="text" id="text" placeholder="Texto" />
    <button onclick="reverse()">reverso</button>
    <button onclick="palindromo()">Palindromo</button>
    <button onclick="duplicado()">Duplicado</button>
    <button onclick="ordenar()">Ordenar</button>
    <button onclick="contador()">Contador de palabras</button>
    <p id="result-2"></p>

    <form action="">
      <label for="">
        Nombre:
        <input type="text" id="nombre" />
      </label>
      <label for="">
        Apellido:
        <input type="text" id="apellido" />
      </label>
      <label for="">
        Edad:
        <input type="edad" id="edad" />
      </label>
      <label for="">
        Profesion
        <input type="text" id="profesion" />
      </label>
      <input type="submit" id="button" value="Mostrar" />
    </form>

    <p id="see"></p>

    <script src="app.js"></script>
  </body>
</html>
